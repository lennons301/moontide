# Local development services for Moontide
# Usage: docker compose up -d
# Reset: docker compose down -v && docker compose up -d

services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: moontide_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # `just test` waits on this before running the integration project: the
    # container is up some seconds before Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
