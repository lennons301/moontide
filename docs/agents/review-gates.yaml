# Repo-specific human-sign-off gates — ADDITIVE extension of the estate
# default (~/code/platform/standards/review-gates.yaml). A repo can add
# gates, never remove estate ones. Same shape:
#
# human_signoff:
#   <category>:
#     - "<glob>"
#
# Moontide takes real money from real customers, so the money paths are
# gated on top of the estate defaults (which already cover visual-ui,
# data-migrations, auth and ci-secrets).
human_signoff:
  payments:
    - "**/api/stripe/**"
    - "**/api/book/**"
    - "**/admin/pricing/**"
    - "**/admin/classes/**"
    - "**/api/admin/classes/**"
  # Anything that emails a customer, or the scheduled jobs that trigger it.
  # A bad send goes out once and cannot be recalled, so these never auto-land.
  notifications:
    - "**/api/cron/**"
    - "**/email.ts"
    - "**/email/**"
  # Cron schedules live in the deployment config, and this plan permits only
  # daily schedules — a sub-daily entry fails the deploy rather than a check.
  deploy-config:
    - "**/vercel.json"
    - "**/vercel.ts"
